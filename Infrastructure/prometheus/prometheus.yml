global:
  scrape_interval: 5s

scrape_configs:
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: sentinel-service
    static_configs:
      - targets: ['sentinel-service:5001']
    metrics_path: /metrics
    scheme: http

  - job_name: audit-service
    static_configs:
      - targets: ['audit-service:5002']
    metrics_path: /metrics
    scheme: http